name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    # 允许手动触发
    inputs:
      enable_nsis:
        description: "Enable NSIS installer generation (Windows only)"
        type: boolean
        default: false
        required: false

env:
  BUILD_TYPE: Release
  PROJECT_NAME: QtAppLauncher
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  code-quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install code quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            cppcheck \
            valgrind

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c++17 \
            --platform=unix64 \
            -I include \
            -I /usr/include/x86_64-linux-gnu/qt6 \
            src/ || echo "cppcheck completed with warnings"

      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            cppcheck-results.xml
          retention-days: 7

  build-windows-mingw:
    name: Build Windows (MinGW)
    runs-on: windows-latest
    needs: [ code-quality-checks ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW
        run: |
          choco install mingw --version 13.2.0 --params="/InstallDir:C:\mingw64 /Architecture:x86_64" -y
          $env:Path = "C:\mingw64\bin;" + $env:Path
          [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::Process)
          gcc --version

      # The windows runners already ship MinGW, CMake, Ninja and vcpkg in
      # their image, so only reinstall what is genuinely missing. Everything
      # expensive (Qt, yaml-cpp) is served from the caches below.
      - name: Install build tools
        run: |
          choco install ninja -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          if (-not (Get-Command mingw32-make -ErrorAction SilentlyContinue)) {
            choco install mingw --version 13.2.0 --params="/InstallDir:C:\mingw64 /Architecture:x86_64" -y
          }

      # Cache the vcpkg *installed tree* (the built yaml-cpp), not the whole
      # vcpkg checkout. The key includes the package version, so bumping the
      # version in the install step below naturally invalidates the cache and
      # forces a rebuild with the new version.
      - name: Restore yaml-cpp from cache
        id: cache-yaml
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed/x64-mingw-dynamic
          key: vcpkg-yaml-cpp-x64-mingw-dynamic-0.9.0-${{ runner.os }}
          restore-keys: |
            vcpkg-yaml-cpp-x64-mingw-dynamic-

      - name: Install yaml-cpp
        if: steps.cache-yaml.outputs.cache-hit != 'true'
        run: |
          # Detect the preinstalled vcpkg: the runner image does NOT export
          # VCPKG_ROOT, so relying on $env:VCPKG_ROOT yields an empty path.
          # Build the candidate list explicitly - piping an empty string into
          # Where-Object can collapse to a bogus single-character result.
          $candidates = @()
          if ($env:VCPKG_ROOT) { $candidates += $env:VCPKG_ROOT }
          $candidates += "C:\vcpkg"
          $candidates += "${{ env.RUNNER_TOOL_CACHE }}\vcpkg"

          $vcpkgRoot = $candidates |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'scripts\buildsystems\vcpkg.cmake')) } |
            Select-Object -First 1

          if (-not $vcpkgRoot) {
            choco install vcpkg -y
            $vcpkgRoot = @($env:VCPKG_ROOT, "C:\vcpkg") |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'scripts\buildsystems\vcpkg.cmake')) } |
              Select-Object -First 1
          }
          if (-not $vcpkgRoot) { throw "vcpkg not found on this runner" }

          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $vcpkgRoot 'vcpkg.exe') install yaml-cpp:x64-mingw-dynamic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure vcpkg env
        shell: pwsh
        run: |
          # Runs even on a cache hit, where the install step was skipped.
          $candidates = @()
          if ($env:VCPKG_ROOT) { $candidates += $env:VCPKG_ROOT }
          $candidates += "C:\vcpkg"
          $candidates += "${{ env.RUNNER_TOOL_CACHE }}\vcpkg"
          $root = $candidates |
            Where-Object { Test-Path (Join-Path $_ 'scripts\buildsystems\vcpkg.cmake') } |
            Select-Object -First 1
          if (-not $root) { throw "vcpkg not found on runner" }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VCPKG_ROOT=$root"

      # Qt is by far the slowest download. The key pins the exact Qt version,
      # so changing 'version:' below is what invalidates this cache.
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.RUNNER_TEMP }}/Qt
          key: qt-${{ runner.os }}-6.5.3-win64_mingw-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            qt-${{ runner.os }}-6.5.3-win64_mingw-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: ${{ env.RUNNER_TEMP }}/Qt
          cache: false

      - name: Configure CMake for MinGW
        run: |
          # Array instead of backtick continuations - a stray character after
          # the backtick breaks the command in a way that is hard to spot.
          $cmakeArgs = @(
            "-B", "build/mingw",
            "-G", "MinGW Makefiles",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic"
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with MinGW
        run: |
          cmake --build build/mingw --config Release

      - name: Create package with CPack
        run: |
          cd build/mingw
          cpack -G ZIP -C Release

          Write-Host "Generated packages:"
          Get-ChildItem "*.zip" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }

      - name: Upload MinGW artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-packages
          path: |
            build/mingw/*.zip
            build/mingw/bin/*.exe
          retention-days: 7

  build-linux-gcc:
    name: Build Linux (GCC)
    runs-on: ubuntu-latest
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6widgets6 \
            libyaml-cpp-dev

      # ccache keyed on the compiler launcher, not on the sources: the
      # dependency set only changes when the install list above changes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-qt6-yamlcpp
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          cmake -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build/linux

      - name: Create package
        run: |
          cd build/linux
          mkdir -p package/bin
          cp bin/QtAppLauncher package/bin/
          tar czf QtAppLauncher-${{ env.BUILD_TYPE }}-Linux.tar.gz -C package .

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/linux/*.tar.gz
            build/linux/bin/*
          retention-days: 7

  build-linux-arm64:
    name: Build Linux ARM64 (GCC)
    runs-on: ubuntu-24.04-arm
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6widgets6 \
            libyaml-cpp-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-qt6-yamlcpp
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake
        run: |
          cmake -B build/linux-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build build/linux-arm64

      - name: Create package
        run: |
          cd build/linux-arm64
          mkdir -p package/bin
          cp bin/QtAppLauncher package/bin/
          tar czf QtAppLauncher-${{ env.BUILD_TYPE }}-Linux-ARM64.tar.gz -C package .

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-packages
          path: |
            build/linux-arm64/*.tar.gz
            build/linux-arm64/bin/*
          retention-days: 7

  build-macos-clang:
    name: Build macOS (Clang)
    runs-on: macos-latest
    needs: [ code-quality-checks ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja ccache yaml-cpp
          # 'qt@6' is only an alias these days; the formula that actually
          # carries Qt6 is 'qt', so resolve whatever brew installed rather
          # than hardcoding a prefix that may not exist.
          brew install qt

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-qt6-yamlcpp
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Configure CMake
        run: |
          # Ask brew for a formula's lib/cmake directory, whatever it is named.
          qt_cmake="$(brew --prefix qt)/lib/cmake/Qt6"
          if [ ! -d "$qt_cmake" ]; then
            qt_cmake="$(brew --prefix qt@6)/lib/cmake/Qt6"
          fi
          if [ ! -d "$qt_cmake" ]; then
            echo "Qt6 cmake config not found" >&2
            exit 1
          fi
          export YAML_CPP_DIR="$(brew --prefix yaml-cpp)/lib/cmake/yaml-cpp"
          echo "Qt6_DIR=$qt_cmake"
          echo "yaml-cpp_DIR=$YAML_CPP_DIR"
          # Use an array instead of backslash/backtick line continuations:
          # a trailing space after a continuation character silently breaks
          # the quoting and bash fails with "unexpected EOF".
          cmake_args=(
            -B build/macos
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DQt6_DIR="$qt_cmake"
            -Dyaml-cpp_DIR="$YAML_CPP_DIR"
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_INSTALL_PREFIX=/usr/local
          )
          cmake "${cmake_args[@]}"

      - name: Build
        run: |
          cmake --build build/macos

      - name: Create package with CPack
        run: |
          cd build/macos
          cpack -G ZIP -C Release

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/macos/*.zip
            build/macos/bin/*
          retention-days: 7

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      [
        build-windows-mingw,
        build-linux-gcc,
        build-linux-arm64,
        build-macos-clang,
      ]
    # 只在推送tag时创建发布
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows-mingw.result == 'success' &&
      needs.build-linux-gcc.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-macos-clang.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs:
      [
        build-windows-mingw,
        build-linux-gcc,
        build-linux-arm64,
        build-macos-clang,
        create-release,
      ]
    if: always()

    steps:
      - name: Display build status
        run: |
          echo "=== Build Status Summary ==="
          echo "Code Quality Checks: ${{ needs.code-quality-checks.result }}"
          echo "Windows MinGW: ${{ needs.build-windows-mingw.result }}"
          echo "Linux GCC: ${{ needs.build-linux-gcc.result }}"
          echo "Linux ARM64: ${{ needs.build-linux-arm64.result }}"
          echo "macOS Clang: ${{ needs.build-macos-clang.result }}"
          echo "Create Release: ${{ needs.create-release.result }}"
          echo "============================"

          # 检查是否有失败的构建
          FAILED_JOBS=""
          if [[ "${{ needs.code-quality-checks.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Code Quality Checks"; fi
          if [[ "${{ needs.build-windows-mingw.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Windows MinGW"; fi
          if [[ "${{ needs.build-linux-gcc.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Linux GCC"; fi
          if [[ "${{ needs.build-linux-arm64.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Linux ARM64"; fi
          if [[ "${{ needs.build-macos-clang.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS macOS Clang"; fi
          if [[ "${{ needs.create-release.result }}" == "failure" ]]; then FAILED_JOBS="$FAILED_JOBS Create Release"; fi

          if [[ -n "$FAILED_JOBS" ]]; then
            echo "Failed jobs:$FAILED_JOBS"
            echo "Some builds failed. Check the logs for details."
            exit 1
          else
            echo "All builds completed successfully!"
          fi
